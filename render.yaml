# Render Blueprint for the API (Dashboard → New → Blueprint → pick this repo).
# Render runs the image CI pushed to GitHub Container Registry; it does not build the Dockerfile itself,
# so what is deployed is exactly what CI tested. CI's deploy job switches it to each new sha-<commit> tag.
services:
  - type: web
    name: vpn-proxy-api
    runtime: image
    image:
      url: ghcr.io/uzair-khiiba/vpn-classifier-mlops:latest
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: false

  # The Streamlit dashboard. It holds no model and calls the API above over HTTPS.
  - type: web
    name: vpn-proxy-dashboard
    runtime: image
    image:
      url: ghcr.io/uzair-khiiba/vpn-classifier-dashboard:latest
    plan: free
    region: singapore
    healthCheckPath: /_stcore/health
    autoDeploy: false
    envVars:
      - key: API_BASE_URL
        value: https://vpn-proxy-api.onrender.com
