name: CI

# lint + test run on every push and pull request. build builds the Docker image every time and smoke-tests it;
# on a push to main (or a v* tag) it also pushes the image to GitHub Container Registry, and deploy tells Render
# to run that exact image. See RUNBOOK.md for redeploying and rolling back.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vpn-classifier-mlops

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - run: ruff check src tests ui experiments --output-format=github

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ui.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ui.txt
      - name: Run pytest
        # The tests use tiny synthetic data and the committed model, so no dataset is needed.
        run: python -m pytest -p no:warnings -rs --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      pushed: ${{ steps.vars.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          TAGS="${IMAGE}:sha-${SHORT_SHA}"
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && TAGS="${TAGS},${IMAGE}:latest"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vpn-proxy-api:ci
          build-args: GIT_SHA=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 8000:8000 vpn-proxy-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          echo
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" \
               -d @examples/vpn_ip.json | grep -q '"is_vpn_proxy":true'
          curl -sf http://localhost:8000/metrics | grep -q '"POST /predict"'
          curl -sf http://localhost:8000/stats | grep -q '"POST /predict"'
          curl -sf http://localhost:8000/model-info | grep -q '"model_status":"loaded"'
          for i in $(seq 1 20); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy ] && break; sleep 3
          done
          docker inspect --format 'Docker HEALTHCHECK: {{.State.Health.Status}}' api
          [ "$(docker inspect --format '{{.State.Health.Status}}' api)" = healthy ]
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: Log in to GitHub Container Registry
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: steps.vars.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: GIT_SHA=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha

  build-dashboard:
    name: Build dashboard image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    env:
      DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/vpn-classifier-dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          PUSH=false
          [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ) ]] && PUSH=true
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          TAGS="${DASHBOARD_IMAGE}:sha-${SHORT_SHA}"
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && TAGS="${TAGS},${DASHBOARD_IMAGE}:latest"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && TAGS="${TAGS},${DASHBOARD_IMAGE}:${GITHUB_REF_NAME}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui.Dockerfile
          load: true
          tags: vpn-proxy-dashboard:ci
          build-args: GIT_SHA=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Smoke-test the image
        run: |
          docker run -d --name dashboard -p 8501:8501 vpn-proxy-dashboard:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
          echo
          curl -sf http://localhost:8501/_stcore/health | grep -q ok
          curl -sf http://localhost:8501/ | grep -qi "<title>streamlit</title>\|streamlit"
      - name: Container logs
        if: always()
        run: docker logs dashboard || true
      - name: Log in to GitHub Container Registry
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: steps.vars.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui.Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: GIT_SHA=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=dashboard

  # Each deploy job first checks its deploy hook. Without it, the deploy steps show as "skipped" and the run
  # summary says which secret is missing, so a skipped deploy can't pass for a successful one.
  deploy-dashboard:
    name: Deploy dashboard to Render
    runs-on: ubuntu-latest
    needs: build-dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check deploy configuration
        id: config
        env:
          HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dashboard deploy SKIPPED: the secret RENDER_DASHBOARD_DEPLOY_HOOK_URL is not set. See RUNBOOK.md."
            echo "### Dashboard deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret \`RENDER_DASHBOARD_DEPLOY_HOOK_URL\` is not set, so nothing was deployed. See RUNBOOK.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Trigger Render deploy of this commit's dashboard image
        if: steps.config.outputs.configured == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK_URL }}
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/vpn-classifier-dashboard
        run: |
          export IMAGE_URL="${IMAGE_BASE}:sha-${GITHUB_SHA::7}"
          ENCODED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_URL"], safe=""))')
          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"
          echo
          echo "Requested deploy of ${IMAGE_URL}"
          echo "### Dashboard deploy requested: \`${IMAGE_URL}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4  # the live check sends examples/vpn_ip.json
      - name: Check deploy configuration
        id: config
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::API deploy SKIPPED: the secret RENDER_DEPLOY_HOOK_URL is not set. See RUNBOOK.md."
            echo "### API deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret \`RENDER_DEPLOY_HOOK_URL\` is not set, so nothing was deployed. See RUNBOOK.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Trigger Render deploy of this commit's image
        if: steps.config.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ${{ env.IMAGE }}:${{ needs.build.outputs.sha_tag }}
        run: |
          ENCODED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["IMAGE_URL"], safe=""))')
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENCODED}"
          echo
          echo "Requested deploy of ${IMAGE_URL}"
          echo "### API deploy requested: \`${IMAGE_URL}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the new build to go live, then check it
        if: steps.config.outputs.configured == 'true' && vars.SERVICE_URL != ''
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          WANT: ${{ needs.build.outputs.sha_tag }}
        run: |
          WANT="${WANT#sha-}"
          for i in $(seq 1 40); do
            BUILD=$(curl -s "$SERVICE_URL/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)
            echo "attempt $i: live build=${BUILD:-?} want=${WANT}"
            if [ "$BUILD" = "$WANT" ]; then
              curl -sf "$SERVICE_URL/health" | grep -q '"status":"ok"'
              curl -sf -X POST "$SERVICE_URL/predict" -H "Content-Type: application/json" \
                   -d @examples/vpn_ip.json | grep -q '"is_vpn_proxy":true'
              curl -sf "$SERVICE_URL/stats" | grep -q '"total_requests"'
              echo "### Live service checked: build ${WANT}, /health ok, /predict ok, /stats ok" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Service did not report build ${WANT} within 10 minutes"
          exit 1
